[package]
name = "augur-policy"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Game-policy gating for Augur: what may ship, and on whose say-so."
publish = false

[dependencies]
augur-core = { path = "../augur-core", version = "0.8.4" }
augur-game-api = { path = "../augur-game-api", version = "0.8.4" }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
