milestones:
  - title: "Milestone 0 - Augur Foundation"
    description: "Exit: fork+branding established w/ attribution; reuse audit committed; runtime-integration decision ratified; architecture documented; adapter boundaries proposed; common schemas drafted; upstream-sync strategy documented; capture approach selected; security/privacy/policy models documented; CI + contributor templates adapted; issue graph created."
  - title: "Milestone 1 - Battlegrounds Advice MVP"
    description: "Exit: app launches; Hearthstone selected/detected; manual observation via hotkey; screenshot reaches a vision model correctly; seasonal pack searchable; schema-valid cited advice; GUI displays it; advice bound to its observation; fixtures + baseline evals; zero gameplay automation. One narrow complete path over premature monitoring."
  - title: "Milestone 2 - Live Battlegrounds Coaching"
    description: "Exit: automatic window capture; change detection prevents unnecessary model calls; match state persists; stale advice invalidates; capture-excluded always-on-top overlay; confidence + refs visible; latency and cost measured; privacy/retention documented; feedback linked to observation, model call, and strategy refs."
  - title: "Milestone 3 - Voice Conversation"
    description: "Exit: recommendations speakable; push-to-talk transcription; questions carry match context; spoken responses; mute/interruption/cancellation; permissions handled; replaceable speech providers; no audio/transcript retention by default; voice diagnostics consent-gated."
  - title: "Milestone 4 - Multi-Game and Community Platform"
    description: "Exit: versioned GameAdapter contract; new-game template + docs; strategy validation tooling; per-game CODEOWNERS; maintainer governance documented; second-game/synthetic adapter validates architecture; platform imports no Battlegrounds concepts; support/policy status visible per game; strategy-only contribution path proven."
