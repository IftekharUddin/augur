# Machine-readable GitHub plan for Augur.
# Sufficient to reproduce the GitHub setup; applied by planning/apply-github-plan.sh (idempotent).
# Issue bodies live beside this file in planning/issues/ (exact intended bodies; #slug refs are
# rewritten to real issue numbers by the apply script after creation).
repository:
  owner: IftekharUddin
  name: augur
  visibility: public
  default_branch: master
  description: "Real-time AI game coaching on the ZeroClaw runtime. A coach, never a bot. First game: Hearthstone Battlegrounds."
  topics: [ai, coaching, gaming, hearthstone, battlegrounds, rust, tauri, zeroclaw]
  homepage: ""
  upstream: https://github.com/zeroclaw-labs/zeroclaw
  settings:
    actions_disabled_at_fork: true   # re-enabled by the ci-adaptation issue
    wiki: false
    issues: true
planning_branch: feat/augur-planning-foundation
planning_pr:
  title: "docs(planning): establish Augur architecture, roadmap, and governance plan"
  base: master
  head: feat/augur-planning-foundation
