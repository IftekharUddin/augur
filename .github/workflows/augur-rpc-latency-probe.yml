# Evidence for decision 0001 (sidecar daemon over local JSON-RPC).
#
# The objection to putting the desktop app behind an IPC hop is latency, and
# the honest answer to it is a number, on every platform Augur ships. This
# builds the kernel and runs `scripts/dev/augur_rpc_latency_probe.py` against a
# real daemon: a Unix domain socket on macOS and Linux, a named pipe on
# Windows. Those are different kernel objects with different costs, so the
# Windows figure is measured, not extrapolated from the Unix one.
#
# Not part of the required gate. It is expensive (a full kernel build per
# platform) and the numbers only change when the transport or the probe does,
# so it runs on demand and whenever the probe itself is touched.
name: Augur RPC Latency Probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/dev/augur_rpc_latency_probe.py"
      - ".github/workflows/augur-rpc-latency-probe.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            transport: unix domain socket
            binary: target/ci/zeroclaw
          - os: windows-latest
            transport: named pipe
            binary: target/ci/zeroclaw.exe
          - os: ubuntu-latest
            transport: unix domain socket
            binary: target/ci/zeroclaw
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Ensure web/dist placeholder exists
        shell: bash
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      # The `ci` profile is release with thin LTO. An unoptimized build would
      # measure rustc, not the transport.
      - name: Build kernel
        run: cargo build --locked --profile ci --bin zeroclaw
      - name: Probe
        shell: bash
        run: |
          python3 scripts/dev/augur_rpc_latency_probe.py \
            --binary "${{ matrix.binary }}" \
            --iterations 200 | tee probe.md
      - name: Publish to the run summary
        shell: bash
        run: |
          {
            echo "## RPC latency: ${{ matrix.os }} (${{ matrix.transport }})"
            echo
            cat probe.md
          } >> "$GITHUB_STEP_SUMMARY"
