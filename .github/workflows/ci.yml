# Augur quality gate.
#
# Replaces the inherited upstream ZeroClaw workflow set, which targeted
# upstream's self-hosted `blacksmith-8vcpu-ubuntu-2404` runners and upstream's
# required-check names. Everything here runs on GitHub-hosted runners only, so
# the gate is reproducible by anyone who forks Augur. The archived upstream
# workflows and the criteria for reviving each one live in
# `.github/workflows-upstream/README.md`.
#
# Branch protection requires exactly one check: `Augur Required Gate`. The
# internal job structure below can change freely without a settings change --
# this is upstream's aggregate-job pattern, kept deliberately.
name: Augur Quality Gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Merge queue builds a temporary `gh-readonly-queue/master/...` ref and fires
  # `merge_group`. The required gate must report on that ref or queued pull
  # requests stall, so the full gate runs there too.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Pinned in one place; every Rust job reads it.
  RUST_TOOLCHAIN: "1.96.1"

jobs:
  # ── Cheap gates first: fail obvious problems before burning compute ───────

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Docs Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Docs link gate contract tests
        run: bash scripts/ci/augur_docs_links_gate.test.sh
      - name: Augur docs link gate
        run: python3 scripts/ci/augur_docs_links_gate.py

  boundaries:
    name: Architecture Boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The RPC-only desktop rule Augur adopts in decision 0001 is the same rule
      # upstream enforces for its TUI. Keeping the upstream gate running here
      # protects the precedent the Augur desktop gate will be copied from.
      - name: Guard zerocode RPC-only boundary
        run: bash scripts/ci/zerocode_no_zeroclaw_dep_gate.sh

  # ── Compile-heavy gates ──────────────────────────────────────────────────
  #
  # Scope note: these run the *default* feature surface, not upstream's
  # `ci-all`. On GitHub-hosted runners the full feature matrix costs far more
  # wall-clock than a coaching fork needs on every pull request; the archived
  # upstream `ci.yml` remains the reference if the wider matrix is ever needed
  # on a schedule. `zeroclaw-desktop` is excluded exactly as upstream excludes
  # it: it pulls GTK/glib system libraries that this gate does not install.

  lint:
    name: Lint
    needs: [fmt]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Ensure web/dist placeholder exists
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Clippy
        run: >-
          cargo clippy --locked --workspace --exclude zeroclaw-desktop
          --all-targets -- -D warnings

  test:
    name: Test
    needs: [fmt]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Ensure web/dist placeholder exists
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Run tests
        run: cargo test --locked --workspace --exclude zeroclaw-desktop

  # ── Required gate ────────────────────────────────────────────────────────
  # Branch protection requires only this job. `if: always()` plus an explicit
  # result scan means a skipped upstream job can never be mistaken for success.

  gate:
    name: Augur Required Gate
    if: always()
    needs: [fmt, docs, boundaries, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more Augur gate jobs failed or were cancelled"
            exit 1
          fi
          echo "All Augur gate jobs passed."
